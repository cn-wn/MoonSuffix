name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, interfaces, and portable tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain version
        run: moon version --all

      - name: Update MoonBit registry
        run: moon update

      - name: Verify formatting
        run: |
          moon fmt
          git diff --exit-code

      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Check Wasm
        run: moon check --target wasm --deny-warn

      - name: Test Wasm
        run: moon test --target wasm --deny-warn

      - name: Test Wasm-GC
        run: moon test --target wasm-gc --deny-warn

      - name: Test JavaScript
        run: moon test --target js --deny-warn

      - name: Check native audit command
        run: moon check cmd/audit --target native --deny-warn

      - name: Test native audit command
        run: moon test cmd/audit --target native --deny-warn

      - name: Check native snapshot command
        run: moon check cmd/snapshot --target native --deny-warn

      - name: Test native snapshot command
        run: moon test cmd/snapshot --target native --deny-warn

      - name: Check native lookup command
        run: moon check cmd/lookup --target native --deny-warn

      - name: Test native lookup command
        run: moon test cmd/lookup --target native --deny-warn

      - name: Check native conformance command
        run: moon check cmd/conformance --target native --deny-warn

      - name: Test native conformance command
        run: moon test cmd/conformance --target native --deny-warn

      - name: Run synthetic PSL conformance cases
        run: |
          moon run --target native cmd/conformance \
            examples/conformance/rules.psl examples/conformance/cases.txt
          if moon run --target native cmd/conformance \
            examples/conformance/rules.psl examples/conformance/failing-cases.txt; then
            echo "mismatched conformance case unexpectedly passed"
            exit 1
          fi

      - name: Run documented example
        run: moon run cmd/main

      - name: Run Unicode hostname example
        run: moon run examples/idna

      - name: Build a pinned snapshot
        run: |
          snapshot_dir="$(mktemp -d)"
          moon run --target native cmd/snapshot \
            examples/audit/old.psl \
            "$snapshot_dir/old.snapshot" \
            --revision example-v1
          test -s "$snapshot_dir/old.snapshot"

      - name: Build a Unicode PSL snapshot
        run: |
          snapshot_dir="$(mktemp -d)"
          moon run --target native cmd/snapshot \
            examples/idna/rules.psl \
            "$snapshot_dir/unicode.snapshot" \
            --revision unicode-example-v1 \
            --idna
          grep -q 'xn--55qx5d.cn' "$snapshot_dir/unicode.snapshot"

      - name: Query a verified Unicode snapshot
        run: |
          snapshot_dir="$(mktemp -d)"
          moon run --target native cmd/snapshot \
            examples/idna/rules.psl \
            "$snapshot_dir/unicode.snapshot" \
            --revision unicode-example-v1 \
            --idna
          moon run --target native cmd/lookup \
            "$snapshot_dir/unicode.snapshot" \
            商店.公司.cn \
            --idna \
            --strict-icann

      - name: Audit verified snapshot bundles
        run: |
          snapshot_dir="$(mktemp -d)"
          moon run --target native cmd/snapshot \
            examples/audit/old.psl \
            "$snapshot_dir/old.snapshot" \
            --revision example-v1
          moon run --target native cmd/snapshot \
            examples/audit/new.psl \
            "$snapshot_dir/new.snapshot" \
            --revision example-v2
          moon run --target native cmd/audit \
            "$snapshot_dir/old.snapshot" \
            "$snapshot_dir/new.snapshot" \
            examples/audit/hosts.txt \
            --bundles \
            --strict-icann

      - name: Run documented audit workflow
        run: |
          moon run --target native cmd/audit \
            examples/audit/old.psl \
            examples/audit/new.psl \
            examples/audit/hosts.txt \
            --from example-v1 \
            --to example-v2 \
            --strict-icann

      - name: Audit Cookie scopes and reject Cookie-only impact
        run: |
          report="$(mktemp)"
          moon run --target native cmd/audit \
            examples/audit/old.psl \
            examples/audit/new.psl \
            examples/audit/stable-hosts.txt \
            --from example-v1 \
            --to example-v2 \
            --strict-icann \
            --cookie-inventory examples/audit/cookies.tsv > "$report"
          grep -q '^hosts_changed=0$' "$report"
          grep -q '^cookies_changed=3$' "$report"
          if moon run --target native cmd/audit \
            examples/audit/old.psl \
            examples/audit/new.psl \
            examples/audit/stable-hosts.txt \
            --from example-v1 \
            --to example-v2 \
            --strict-icann \
            --cookie-inventory examples/audit/cookies.tsv \
            --fail-on-impact; then
            echo "Cookie-only audit gate unexpectedly accepted a changed inventory"
            exit 1
          fi

      - name: Reject malformed audit inventories with source lines
        run: |
          diagnostic="$(mktemp)"
          if moon run --target native cmd/audit \
            examples/audit/old.psl examples/audit/new.psl \
            examples/audit/invalid-hosts.txt \
            --from example-v1 --to example-v2 > "$diagnostic" 2>&1; then
            echo "malformed hostname inventory unexpectedly passed"
            exit 1
          fi
          grep -q 'hostname inventory line 2:' "$diagnostic"
          if moon run --target native cmd/audit \
            examples/audit/old.psl examples/audit/new.psl \
            examples/audit/stable-hosts.txt \
            --from example-v1 --to example-v2 \
            --cookie-inventory examples/audit/invalid-cookies.tsv \
            > "$diagnostic" 2>&1; then
            echo "malformed Cookie inventory unexpectedly passed"
            exit 1
          fi
          grep -q 'cookie inventory line 2:' "$diagnostic"

      - name: Audit Unicode rules and inventories
        run: |
          report="$(mktemp)"
          if moon run --target native cmd/audit \
            examples/audit/old-unicode.psl \
            examples/audit/new-unicode.psl \
            examples/audit/unicode-hosts.txt \
            --from old --to new --idna --strict-icann \
            --cookie-inventory examples/audit/unicode-cookies.tsv \
            --fail-on-impact > "$report"; then
            echo "Unicode audit gate unexpectedly passed"
            exit 1
          fi
          grep -q '^hosts_changed=1$' "$report"
          grep -q '^cookies_changed=1$' "$report"
          grep -q 'xn--55qx5d.cn' "$report"

      - name: Verify audit gate on unchanged snapshots
        run: |
          moon run --target native cmd/audit \
            examples/audit/old.psl \
            examples/audit/old.psl \
            examples/audit/hosts.txt \
            --from example-v1 \
            --to example-v1 \
            --strict-icann \
            --fail-on-impact

      - name: Verify audit gate rejects affected hosts
        run: |
          if moon run --target native cmd/audit \
            examples/audit/old.psl \
            examples/audit/new.psl \
            examples/audit/hosts.txt \
            --from example-v1 \
            --to example-v2 \
            --strict-icann \
            --fail-on-impact; then
            echo "audit gate unexpectedly accepted a changed inventory"
            exit 1
          fi
